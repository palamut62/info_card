<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Card Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Custom Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-icon"></div>
      <span class="titlebar-title">Info Card Generator</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize" id="btnMinimize" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn maximize" id="btnMaximize" aria-label="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button class="titlebar-btn close" id="btnClose" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Info Card</h1>
        <span class="version">v1.0</span>
      </div>

      <div class="sidebar-body">
        <div class="section">
          <label>Topic</label>
          <textarea id="topicInput" rows="2" placeholder="e.g. Docker setup, github.com/ollama/ollama..."></textarea>
        </div>

        <div class="inline-row">
          <label class="toggle-label" for="webSearchToggle">
            <input type="checkbox" id="webSearchToggle" checked>
            <span class="toggle-switch"></span>
            <span class="toggle-text">Web</span>
          </label>
          <button id="generateBtn" class="btn-primary compact">Generate</button>
        </div>

        <div class="section">
          <label>Theme</label>
          <div class="theme-grid" id="themeGrid"></div>
        </div>

        <div class="grid-2col">
          <div class="section">
            <label>Font</label>
            <select id="fontSelect">
              <option value="Inter">Inter</option>
              <option value="Poppins">Poppins</option>
              <option value="system-ui">System</option>
            </select>
          </div>
          <div class="section">
            <label>Code</label>
            <select id="codeFontSelect">
              <option value="JetBrains Mono">JetBrains</option>
              <option value="Fira Code">Fira Code</option>
              <option value="monospace">Mono</option>
            </select>
          </div>
        </div>

        <div class="section">
          <label>Size</label>
          <select id="sizeSelect">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </div>

        <div class="btn-row">
          <button id="settingsBtn" class="btn-secondary">Settings</button>
          <button id="exportBtn" class="btn-secondary" disabled>PNG</button>
        </div>
        <button id="shareXBtn" class="btn-x" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Share on X
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <div class="card-container" id="cardContainer">
        <div class="empty-state">
          <span class="empty-icon">&#x1F3A8;</span>
          <p>Enter a topic and click "Generate Card" to create an info card</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>OpenRouter API Key</label>
          <input type="password" id="apiKeyInput" placeholder="sk-or-...">
        </div>
        <div class="form-group">
          <label>Model</label>
          <div class="model-row">
            <select id="modelSelect">
              <option value="google/gemma-3-27b-it:free">Gemma 3 27B (Free)</option>
              <option value="deepseek/deepseek-chat-v3-0324:free">DeepSeek V3 (Free)</option>
              <option value="meta-llama/llama-4-maverick:free">Llama 4 Maverick (Free)</option>
              <option value="anthropic/claude-sonnet-4">Claude Sonnet 4</option>
              <option value="openai/gpt-4o">GPT-4o</option>
            </select>
            <button id="fetchModelsBtn" class="btn-small">Load Models</button>
          </div>
        </div>
        <div class="separator"></div>
        <div class="form-group">
          <label>X / Twitter API Key</label>
          <input type="password" id="xApiKey" placeholder="API Key (Consumer Key)">
        </div>
        <div class="form-group">
          <label>X API Secret</label>
          <input type="password" id="xApiSecret" placeholder="API Secret (Consumer Secret)">
        </div>
        <div class="form-group">
          <label>X Access Token</label>
          <input type="password" id="xAccessToken" placeholder="Access Token">
        </div>
        <div class="form-group">
          <label>X Access Token Secret</label>
          <input type="password" id="xAccessTokenSecret" placeholder="Access Token Secret">
        </div>
        <button id="saveSettingsBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
